# --------- General Configs ---------
GENERAL:
  runner: 'LTSFTrainer'
  batch_size: 32   
  max_epochs: 20 
  early_stop_patience: 5

# --------- Model Configs ---------
MODEL_PARAM:
  seq_len_in: 96
  seq_len_out: 96
  enc_in: 170
  d_model: 512
  d_state: 32
  d_conv: 2
  expand: 1
  dropout: 0.1
  d_ff: 512
  e_layers: 2
  use_norm: False
  ffn_activation: 'gelu'