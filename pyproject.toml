[project]
name = "bats"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.4.1",
    "pyyaml>=6.0.3",
    "rich>=14.2.0",
    "torch>=2.9.1",
    "torchinfo>=1.8.0",
]

[tool.ruff]
preview = true

lint.select = [
    "E",
    "F",
    "W",
    "C90",
    "B",
    "UP",
    "C4",
    "TID",
    "ARG",
    "PTH",
]
lint.ignore = ["E501", "D"]

line-length = 88
target-version = "py312"

exclude = [
    ".venv",
    "__pycache__",
    "build",
    "dist",
    ".git",
]

[tool.ruff.format]
preview = true
quote-style = "single"

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.12"
exclude = [
    "**/node_modules",
    "**/__pycache__",
    ".venv",
    "venv",
    "build",
    "dist",
    "notebooks",
]
